name: inference-ci
on:
  push:
  workflow_dispatch:

concurrency:
  group: gpu-pod
  cancel-in-progress: false

jobs:
  throughput-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The 200 tok/s bar (A5000, 16 prompts x 32 tokens) assumes the engine runs on the GPU,
      # in fp16/bf16, with the KV cache on, and generates the whole batch in one padded
      # generate() call. One prompt at a time tops out around 60 tok/s on this pod.
      MIN_TOKENS_PER_SEC: "200"
      REQUIRE_GPU: "1"
      HOST: ${{ secrets.RUNPOD_SSH_HOST }}
      PORT: ${{ secrets.RUNPOD_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Connect to GPU pod
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.RUNPOD_SSH_KEY }}" > ~/.ssh/pod && chmod 600 ~/.ssh/pod
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Ship commit to pod
        run: |
          tar czf - --exclude=.git . | ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=60 -i ~/.ssh/pod -p "$PORT" "root@$HOST" \
            "rm -rf /root/runs && mkdir -p /root/runs/$GITHUB_SHA && tar xzf - --no-same-owner -C /root/runs/$GITHUB_SHA"
      - name: Throughput gate (GPU pod)
        run: |
          ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=60 -i ~/.ssh/pod -p "$PORT" "root@$HOST" \
            "cd /root/runs/$GITHUB_SHA && MIN_TOKENS_PER_SEC=$MIN_TOKENS_PER_SEC REQUIRE_GPU=$REQUIRE_GPU bash deploy/run_bench.sh"
