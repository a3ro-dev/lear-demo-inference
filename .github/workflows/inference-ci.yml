name: inference-ci
on:
  push:
  workflow_dispatch:

concurrency:
  group: gpu-pod
  cancel-in-progress: false

jobs:
  throughput-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIN_TOKENS_PER_SEC: "200"
      REQUIRE_GPU: "1"
      HOST: ${{ secrets.RUNPOD_SSH_HOST }}
      PORT: ${{ secrets.RUNPOD_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Connect to GPU pod
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.RUNPOD_SSH_KEY }}" > ~/.ssh/pod && chmod 600 ~/.ssh/pod
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Ship commit to pod
        run: |
          tar czf - --exclude=.git . | ssh -i ~/.ssh/pod -p "$PORT" "root@$HOST" \
            "rm -rf /workspace/runs/$GITHUB_SHA && mkdir -p /workspace/runs/$GITHUB_SHA && tar xzf - --no-same-owner -C /workspace/runs/$GITHUB_SHA"
      - name: Throughput gate (GPU pod)
        run: |
          ssh -i ~/.ssh/pod -p "$PORT" "root@$HOST" \
            "cd /workspace/runs/$GITHUB_SHA && MIN_TOKENS_PER_SEC=$MIN_TOKENS_PER_SEC REQUIRE_GPU=$REQUIRE_GPU bash deploy/run_bench.sh"
